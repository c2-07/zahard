name: Release CLI

on:
  release:
    types: [published]

jobs:
  build-and-release:
    name: Build for ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: za-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: za-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: za-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: za-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: za-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: za-windows-aarch64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Binary
        working-directory: ./cli
        env:
          # Production API URL
          ZA_DEFAULT_API_URL: "https://zahard.vercel.app/api"
          # For Linux ARM cross-compilation
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: mv cli/target/${{ matrix.target }}/release/za cli/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Rename Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: mv cli/target/${{ matrix.target }}/release/za.exe cli/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
