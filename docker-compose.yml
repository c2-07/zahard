version: '3.8'

services:
  app:
    build: .
    ports:
      - "4321:4321"
    environment:
      - JWT_SECRET=change_this_to_a_random_secure_string
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=4321
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped
